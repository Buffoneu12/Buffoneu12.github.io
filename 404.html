<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada — Júlia Buffon</title>
  <meta name="description" content="O endereço que você tentou acessar não existe ou foi movido.">
  <meta name="theme-color" content="#0B0D10">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">

  <script>
    try {
      var t = localStorage.getItem('jb-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>
  <a class="skip-link" href="#conteudo" data-i18n="a11y.skip">Pular para o conteúdo</a>

  <header class="site-header">
    <div class="site-header__inner container">
      <a class="brand" href="/">Júlia Buffon</a>
      <div class="controls">
        <button class="control-btn" id="lang-toggle" type="button"
                aria-label="EN — Mudar para inglês" data-i18n-attr="aria-label:lang.switch">EN</button>
        <button class="control-btn" id="theme-toggle" type="button"
                aria-label="Mudar para tema claro" data-i18n-attr="aria-label:theme.toLight">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" hidden>
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="conteudo" class="container section">
    <p class="section__label">404</p>
    <h1 class="section__title" data-i18n="error.title">Página não encontrada</h1>
    <p data-i18n="error.text">O endereço que você tentou acessar não existe ou foi movido.</p>
    <p class="hero__actions">
      <a class="btn btn--primary" href="/" data-i18n="error.cta">Voltar para o início</a>
    </p>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner container">
      <p>© <span id="ano">2026</span> Júlia Buffon</p>
      <p data-i18n="footer.built">Feito com HTML, CSS e JavaScript.</p>
    </div>
  </footer>

  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
